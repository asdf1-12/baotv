plugins {
    id 'com.android.application'
}

android {
    namespace 'com.baotv.iptv'
    compileSdk 34

    defaultConfig {
        applicationId "com.baotv.iptv"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // Keep the APK small / TV-friendly: no splits, no extra resources
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // No AppCompat / media3-ui: framework Activity + SurfaceView keeps the
    // APK small for the 2 GB RAM Haier TV. HLS comes from exoplayer-hls.
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
    implementation 'androidx.media3:media3-common:1.2.1'
}
